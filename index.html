<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web3 Wallet Connect</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      .card {
        background: white;
        padding: 30px;
        width: 350px;
        border-radius: 10px;
        box-shadow: 0 5px 10px rgba(0,0,0,0.1);
        text-align: center;
      }

      button {
        padding: 12px 20px;
        background: #4a00e0;    
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        margin-top: 15px;
        font-size: 16px;
      }

      button:hover {
        background: #6100ff;
      }

      #address {
        margin-top: 20px;
        font-size: 14px;
        color: #333;
        word-wrap: break-word;
      }
    </style>
</head>
<body>

    <div class="card">
        <h2>Connect Your Wallet</h2>
        <button id="connectButton">Connect MetaMask</button>
        <p id="address"></p>
    </div>

<script>
    const connectButton = document.getElementById("connectButton");
    const addressText = document.getElementById("address");

    connectButton.addEventListener("click", async () => {
        if (typeof window.ethereum !== "undefined") {
            try {
              const accounts = await ethereum.request({ method: "eth_requestAccounts" });
              const walletaddress = accounts[0];
              addressText.innerHTML = "Connected: " +walletAddress;
            } catch (error) {
              addressText.innerHTML = "Error connecting wallet!";
            } 
        } else {
          alert("MetaMask not found! Install it from metamask.io");
        }
      });
</script>    

</body>
</html>
